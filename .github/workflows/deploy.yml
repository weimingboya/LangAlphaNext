name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_supabase:
        description: Deploy Supabase migrations
        type: boolean
        default: false
      deploy_langgraph:
        description: Deploy LangGraph Agent Server
        type: boolean
        default: false
      deploy_vercel:
        description: Deploy Vercel application
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
      langgraph: ${{ steps.filter.outputs.langgraph }}
      vercel: ${{ steps.filter.outputs.vercel }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect deployment targets
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            supabase:
              - 'supabase/migrations/**'
            langgraph:
              - 'langgraph.json'
              - 'src/langalpha/__init__.py'
              - 'src/langalpha/agent/**'
              - 'src/langalpha/backends/**'
              - 'src/langalpha/capabilities/**'
              - 'src/langalpha/integrations/**'
              - 'src/langalpha/projects/**'
              - 'src/langalpha/resources/**'
              - 'src/langalpha/config.py'
              - 'src/langalpha/domain/**'
              - 'pyproject.toml'
              - 'uv.lock'
            vercel:
              - 'vercel.json'
              - 'api/**'
              - 'web/**'
              - 'src/langalpha/__init__.py'
              - 'src/langalpha/server/**'
              - 'src/langalpha/assets/**'
              - 'src/langalpha/security/**'
              - 'src/langalpha/projects/**'
              - 'src/langalpha/domain/**'
              - 'src/langalpha/config.py'
              - 'src/langalpha/backends/__init__.py'
              - 'src/langalpha/backends/daytona.py'
              - 'pyproject.toml'
              - 'uv.lock'

  verify:
    needs: detect-changes
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.deploy_supabase || inputs.deploy_langgraph || inputs.deploy_vercel)) ||
      (github.event_name == 'push' &&
        (needs.detect-changes.outputs.supabase == 'true' ||
          needs.detect-changes.outputs.langgraph == 'true' ||
          needs.detect-changes.outputs.vercel == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --all-groups

      - name: Run release gates
        run: |
          make lint
          make test
          npm --prefix web run build
          uv run langgraph validate

  deploy-supabase:
    needs: [detect-changes, verify]
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_supabase) ||
        (github.event_name == 'push' &&
          needs.detect-changes.outputs.supabase == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --linked

  deploy-langgraph:
    needs: [detect-changes, verify, deploy-supabase]
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.verify.result == 'success' &&
      (needs.deploy-supabase.result == 'success' ||
        needs.deploy-supabase.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_langgraph) ||
        (github.event_name == 'push' &&
          needs.detect-changes.outputs.langgraph == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --all-groups

      - name: Prepare LangGraph deployment environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          APP_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          required = (
              "OPENAI_API_KEY",
              "DAYTONA_API_KEY",
              "LANGSMITH_API_KEY",
              "SUPABASE_URL",
              "SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_SECRET_KEY",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing production secrets: " + ", ".join(missing))

          values = {
              name: os.environ.get(name, "")
              for name in (
                  *required,
                  "FRED_API_KEY",
                  "MASSIVE_API_KEY",
                  "SEC_USER_AGENT",
                  "APP_VERSION",
              )
          }
          values.update(
              {
                  "APP_ID": "langalpha",
                  "APP_ENVIRONMENT": "production",
                  "LANGGRAPH_ASSISTANT_ID": "main",
                  "LANGSMITH_PROJECT": "langalpha-production",
                  "LANGSMITH_TRACING": "true",
                  "SUPABASE_STORAGE_BUCKET": "langalpha-assets",
              }
          )
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items() if value),
              encoding="utf-8",
          )
          PY

      - name: Deploy LangGraph Agent Server
        run: |
          uv run langgraph deploy \
            --name langalpha \
            --deployment-type prod \
            --remote \
            --no-input

  deploy-vercel:
    needs: [detect-changes, verify, deploy-supabase, deploy-langgraph]
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.verify.result == 'success' &&
      (needs.deploy-supabase.result == 'success' ||
        needs.deploy-supabase.result == 'skipped') &&
      (needs.deploy-langgraph.result == 'success' ||
        needs.deploy-langgraph.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_vercel) ||
        (github.event_name == 'push' &&
          needs.detect-changes.outputs.vercel == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web application
        run: npm --prefix web run build

      - name: Install Python
        run: uv python install 3.12

      - name: Install Vercel CLI
        run: npm install --global vercel@57.0.0

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel production
        id: vercel
        run: |
          url="$(
            vercel deploy \
              --prebuilt \
              --prod \
              --archive=tgz \
              --token="${{ secrets.VERCEL_TOKEN }}"
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify production readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl "${{ steps.vercel.outputs.url }}/" \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors > /dev/null
          vercel curl "${{ steps.vercel.outputs.url }}/health" \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors
          vercel curl "${{ steps.vercel.outputs.url }}/ready" \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors
