[project]
name = "langalpha-next"
version = "0.1.0"
description = "LangAlpha clean-room rewrite on Deep Agents, LangGraph Agent Server, and Daytona."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "daytona==0.200.1",
    "deepagents==0.6.12",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "langchain==1.3.14",
    "langchain-daytona==0.0.7",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai==1.4.0",
    "langchain-quickjs==0.3.3",
    "langgraph==1.2.9",
    "langgraph-sdk==0.4.2",
    "orjson==3.11.9",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[project.scripts]
langalpha-api = "langalpha.server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langalpha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "external: paid tests against real OpenAI and Daytona services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
